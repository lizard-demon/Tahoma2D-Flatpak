app-id: io.github.tahoma2d.Tahoma2D
runtime: org.kde.Platform
runtime-version: '5.15-25.08'
sdk: org.kde.Sdk
command: Tahoma2D
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --share=network
  - --filesystem=home
  - --env=QT_QPA_PLATFORM=xcb

modules:
  - name: intltool
    cleanup:
      - '*'
    sources:
      - type: archive
        url: https://launchpad.net/intltool/trunk/0.51.0/+download/intltool-0.51.0.tar.gz
        sha256: 67c74d94196b153b774ab9f89b2fa6c6ba79352407037c8c14d5aeb334e959cd

  - name: lzo
    buildsystem: autotools
    sources:
      - type: archive
        url: https://www.oberhumer.com/opensource/lzo/download/lzo-2.10.tar.gz
        sha256: c0f892943208266f9b6543b3ae308fab6284c5c90e627931446fb49b4221a072

  - name: json-c
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: git
        url: https://github.com/json-c/json-c.git
        tag: json-c-0.14-20200419

  - name: libmypaint
    buildsystem: autotools
    sources:
      - type: archive
        url: https://github.com/mypaint/libmypaint/releases/download/v1.6.1/libmypaint-1.6.1.tar.xz
        sha256: 741754f293f6b7668f941506da07cd7725629a793108bb31633fb6c3eae5315f

  - name: opencv
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DBUILD_LIST=core,imgproc,video,features2d,flann,calib3d,objdetect,videoio,highgui,imgcodecs
      - -DBUILD_EXAMPLES=OFF
      - -DBUILD_TESTS=OFF
    sources:
      - type: archive
        url: https://github.com/opencv/opencv/archive/4.13.0.tar.gz
        sha256: 1d40ca017ea51c533cf9fd5cbde5b5fe7ae248291ddf2af99d4c17cf8e13017d

  - name: glew
    buildsystem: cmake-ninja
    builddir: true
    subdir: build/cmake
    config-opts:
      - -DBUILD_UTILS=OFF
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: archive
        url: https://github.com/nigels-com/glew/releases/download/glew-2.2.0/glew-2.2.0.tgz
        sha256: d4fc82893cfb00109578d0a1a2337fb8ca335b3ceccf97b97e5cc7f08e4353e1

  - name: libwebp
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_SHARED_LIBS=ON
    sources:
      - type: git
        url: https://github.com/webmproject/libwebp.git
        tag: v1.4.0

  - name: openblas
    buildsystem: cmake-ninja
    build-options:
      cflags: "-Wno-incompatible-pointer-types -Wno-implicit-function-declaration -Wno-implicit-int"
    config-opts:
      - -DBUILD_SHARED_LIBS=ON
      - -DNOFORTRAN=1
      - -DBUILD_WITHOUT_LAPACK=1
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DCMAKE_C_STANDARD=99
      - -DBUILD_TESTING=OFF
    sources:
      - type: git
        url: https://github.com/OpenMathLib/OpenBLAS.git
        tag: v0.3.27

  - name: superlu
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DBUILD_SHARED_LIBS=ON
      - -Denable_tests=OFF
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DCMAKE_C_STANDARD=99
    sources:
      - type: git
        url: https://github.com/xiaoyeli/superlu.git
        tag: v5.3.0

  - name: boost
    buildsystem: simple
    build-commands:
      - ./bootstrap.sh --prefix=/app
      - ./b2 -j $FLATPAK_BUILDER_N_JOBS install variant=release link=shared threading=multi -d0
    sources:
      - type: archive
        url: https://archives.boost.io/release/1.84.0/source/boost_1_84_0.tar.bz2
        sha256: cc4b893acf645c9d4b698e9a0f08ca8846aa5d6c68275c14c3e7949c24109454

  - name: glu
    buildsystem: meson
    sources:
      - type: git
        url: https://gitlab.freedesktop.org/mesa/glu.git
        tag: glu-9.0.3

  - name: freeglut
    buildsystem: cmake-ninja
    config-opts:
      - -DFREEGLUT_BUILD_STATIC_LIBS=OFF
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DCMAKE_C_STANDARD=99
    sources:
      - type: git
        url: https://github.com/FreeGLUTProject/freeglut.git
        tag: v3.4.0

  - name: libdeflate
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://github.com/ebiggers/libdeflate.git
        tag: v1.20

  - name: tahoma2d
    buildsystem: simple
    build-commands:
      - cd thirdparty/tiff-4.2.0 && ./configure --with-pic --disable-jbig --disable-shared
      - cd thirdparty/tiff-4.2.0 && make -j $FLATPAK_BUILDER_N_JOBS
      - mkdir -p toonz/build
      - cd toonz/build && cmake -G Ninja -DCMAKE_INSTALL_PREFIX=/app -DCMAKE_BUILD_TYPE=Release -DQT_VERSION_MAJOR=5 -DWITH_SYSTEM_LZO=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DTIFF_LIBRARY=${FLATPAK_BUILDER_BUILDDIR}/thirdparty/tiff-4.2.0/libtiff/.libs/libtiff.a -DDEFLATE_LIB=/app/lib/libdeflate.so -DGLUT_LIB=/app/lib/libglut.so -DGLU_LIB=/app/lib/libGLU.so -DCMAKE_CXX_STANDARD_LIBRARIES="-lwebp -lopenblas" ../sources
      - cd toonz/build && ninja -j $FLATPAK_BUILDER_N_JOBS
      - cd toonz/build && ninja install
      - mv /app/bin/Tahoma2D /app/bin/Tahoma2D.bin
    sources:
      - type: git
        url: https://github.com/tahoma2d/tahoma2d.git
        branch: master

  - name: tahoma2d-wrapper
    buildsystem: simple
    build-commands:
      - install -Dm755 Tahoma2D.sh /app/bin/Tahoma2D
    sources:
      - type: script
        dest-filename: Tahoma2D.sh
        commands:
          - unset SESSION_MANAGER
          - STUFF_DIR="${XDG_CONFIG_HOME:-$HOME/.config}/Tahoma2D/tahoma2dstuff"
          - if [ ! -d "$STUFF_DIR" ]; then
          - '  mkdir -p "${STUFF_DIR%/*}"'
          - '  cp -r /app/share/tahoma2d/stuff "$STUFF_DIR"'
          - '  chmod -R u+w "$STUFF_DIR"'
          - fi
          - export LD_LIBRARY_PATH="/app/lib/tahoma2d:/app/lib:${LD_LIBRARY_PATH}"
          - exec /app/bin/Tahoma2D.bin -TAHOMA2DROOT "$STUFF_DIR" "$@"
